# Hydrogen (H2O) — фронтенд-сервер и reverse proxy к Go API.
#
#   браузер :8080
#      ├── /api/*  ->  http://go-backend:8081/api/*
#      └── /*      ->  /var/www/frontend (статика)

listen:
  port: 8080

server-name: hydrogen-pop-density

hosts:
  "default":
    paths:
      "/api":
        proxy.reverse.url: "http://go-backend:8081/"
        proxy.preserve-host: ON
      "/":
        file.dir: /var/www/frontend
        file.index: [ "index.html" ]
        file.dirlisting: OFF

access-log: /dev/stdout
error-log: /dev/stderr
